name: NearPortal acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEARPORTAL_JUDGE_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: node --test test/acceptance.test.mjs
