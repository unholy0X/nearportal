# Use with compose.yaml on the always-on server; DNS must point at that server.
# Caddy is the only published service and the only trusted proxy (fixed address).
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-nearportal.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      edge:
        ipv4_address: 172.31.250.10
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nearportal:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
volumes:
  caddy-data:
  caddy-config:
