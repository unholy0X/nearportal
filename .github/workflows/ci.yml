name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: typecheck, tests, build, simulated demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm run install:all
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the pinned Playwright browser for the demo
        run: npx --prefix apps/server playwright install --with-deps chromium
      - run: npm run demo:sim

  contracts:
    name: contract tests (pinned cargo-near image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm run test:contracts
